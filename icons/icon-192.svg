<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="bladeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <linearGradient id="pencilGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="50%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- 背景パネル -->
  <rect width="192" height="192" rx="42" fill="url(#bgGrad)"/>
  <rect x="6" y="6" width="180" height="180" rx="36" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" opacity="0.6"/>

  <!-- 光輪・エンブレムリング -->
  <circle cx="96" cy="96" r="68" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-dasharray="4 6" opacity="0.4"/>
  <circle cx="96" cy="96" r="62" fill="#1e293b" fill-opacity="0.5" stroke="#38bdf8" stroke-width="2" opacity="0.8"/>

  <!-- 魔法の盾シンボル -->
  <path d="M96 42 L132 58 C132 100 116 130 96 146 C76 130 60 100 60 58 Z" fill="#0f172a" stroke="url(#goldGrad)" stroke-width="3" filter="url(#glow)"/>

  <!-- クロス：剣（RPG） -->
  <g transform="rotate(45 96 96)">
    <!-- 刀身 -->
    <path d="M94 50 L98 50 L99 118 L96 122 L93 118 Z" fill="url(#bladeGrad)"/>
    <path d="M96 50 L98 50 L98 118 L96 122 Z" fill="#ffffff" opacity="0.6"/>
    <!-- 鍔 -->
    <rect x="85" y="118" width="22" height="5" rx="2" fill="url(#goldGrad)"/>
    <!-- 柄 -->
    <rect x="94" y="123" width="4" height="14" rx="1" fill="#78350f"/>
    <!-- 柄頭 -->
    <circle cx="96" cy="139" r="4" fill="url(#goldGrad)"/>
  </g>

  <!-- クロス：鉛筆（STUDY） -->
  <g transform="rotate(-45 96 96)">
    <!-- 鉛筆の軸 -->
    <rect x="91" y="58" width="10" height="64" rx="1" fill="url(#pencilGrad)"/>
    <!-- 削り部分 -->
    <polygon points="91,58 101,58 96,44" fill="#fde68a"/>
    <!-- 芯 -->
    <polygon points="94,48 98,48 96,44" fill="#1e293b"/>
    <!-- 消しゴム金具 -->
    <rect x="90" y="122" width="12" height="6" fill="#94a3b8"/>
    <!-- 消しゴム -->
    <rect x="91" y="128" width="10" height="8" rx="2" fill="#f43f5e"/>
  </g>

  <!-- 中央の輝く星 -->
  <polygon points="96,78 99,88 109,91 101,98 103,108 96,102 89,108 91,98 83,91 93,88" fill="url(#goldGrad)" filter="url(#glow)"/>

  <!-- タイトル頭文字 "SQ" -->
  <text x="96" y="170" font-family="'BIZ UDPGothic', 'Segoe UI', sans-serif" font-size="16" font-weight="900" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="2">STUDY QUEST</text>
</svg>
