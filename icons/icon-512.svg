<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="goldGrad512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="bladeGrad512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <linearGradient id="pencilGrad512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="50%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <filter id="glow512" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- 背景パネル -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad512)"/>
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="url(#goldGrad512)" stroke-width="6" opacity="0.65"/>

  <!-- 光輪・エンブレムリング -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#goldGrad512)" stroke-width="4" stroke-dasharray="10 16" opacity="0.45"/>
  <circle cx="256" cy="256" r="165" fill="#1e293b" fill-opacity="0.5" stroke="#38bdf8" stroke-width="5" opacity="0.85"/>

  <!-- 魔法の盾シンボル -->
  <path d="M256 112 L352 154 C352 266 309 346 256 388 C203 346 160 266 160 154 Z" fill="#0f172a" stroke="url(#goldGrad512)" stroke-width="8" filter="url(#glow512)"/>

  <!-- クロス：剣（RPG） -->
  <g transform="rotate(45 256 256)">
    <!-- 刀身 -->
    <path d="M251 133 L261 133 L264 314 L256 325 L248 314 Z" fill="url(#bladeGrad512)"/>
    <path d="M256 133 L261 133 L261 314 L256 325 Z" fill="#ffffff" opacity="0.6"/>
    <!-- 鍔 -->
    <rect x="227" y="314" width="58" height="13" rx="5" fill="url(#goldGrad512)"/>
    <!-- 柄 -->
    <rect x="251" y="327" width="10" height="37" rx="3" fill="#78350f"/>
    <!-- 柄頭 -->
    <circle cx="256" cy="370" r="10" fill="url(#goldGrad512)"/>
  </g>

  <!-- クロス：鉛筆（STUDY） -->
  <g transform="rotate(-45 256 256)">
    <!-- 鉛筆の軸 -->
    <rect x="243" y="154" width="26" height="170" rx="3" fill="url(#pencilGrad512)"/>
    <!-- 削り部分 -->
    <polygon points="243,154 269,154 256,117" fill="#fde68a"/>
    <!-- 芯 -->
    <polygon points="251,127 261,127 256,117" fill="#1e293b"/>
    <!-- 消しゴム金具 -->
    <rect x="240" y="324" width="32" height="16" fill="#94a3b8"/>
    <!-- 消しゴム -->
    <rect x="243" y="340" width="26" height="21" rx="5" fill="#f43f5e"/>
  </g>

  <!-- 中央の輝く星 -->
  <polygon points="256,208 264,234 290,242 270,261 275,288 256,272 237,288 242,261 222,242 248,234" fill="url(#goldGrad512)" filter="url(#glow512)"/>

  <!-- タイトル頭文字 "STUDY QUEST" -->
  <text x="256" y="452" font-family="'BIZ UDPGothic', 'Segoe UI', sans-serif" font-size="42" font-weight="900" fill="url(#goldGrad512)" text-anchor="middle" letter-spacing="4">STUDY QUEST</text>
</svg>
